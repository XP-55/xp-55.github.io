<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="AI Harness types diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1730"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .t { font: 600 22px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #f8fafc; }
      .h { font: 700 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #f8fafc; }
      .s { font: 400 14px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #cbd5e1; }
      .tag { font: 600 12px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #bfdbfe; letter-spacing: .12em; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="376" rx="16" fill="none" stroke="#1f2a44"/>
  <text x="46" y="72" class="t">AI Harness 的三类形态</text>
  <text x="46" y="102" class="s">同一套工程骨架，不同的目标函数与用例集合</text>

  <g filter="url(#shadow)">
    <g>
      <rect x="60" y="140" width="350" height="220" rx="14" fill="url(#card)" stroke="#1f2a44"/>
      <text x="86" y="176" class="tag">EVALUATION</text>
      <text x="86" y="210" class="h">评测 Harness</text>
      <text x="86" y="242" class="s">目标：改动是否变“更好”</text>
      <text x="86" y="270" class="s">指标：准确性 / 引用一致 / 结构合规</text>
      <text x="86" y="298" class="s">关注：成本 / 延迟 / 稳定性</text>
    </g>

    <g>
      <rect x="425" y="140" width="350" height="220" rx="14" fill="url(#card)" stroke="#1f2a44"/>
      <text x="451" y="176" class="tag">RED TEAM</text>
      <text x="451" y="210" class="h">红队 Harness</text>
      <text x="451" y="242" class="s">目标：改动是否变“更安全”</text>
      <text x="451" y="270" class="s">覆盖：提示注入 / 外泄 / 越权工具调用</text>
      <text x="451" y="298" class="s">关注：证据链与审计可复盘</text>
    </g>

    <g>
      <rect x="790" y="140" width="350" height="220" rx="14" fill="url(#card)" stroke="#1f2a44"/>
      <text x="816" y="176" class="tag">REGRESSION</text>
      <text x="816" y="210" class="h">回归 Harness</text>
      <text x="816" y="242" class="s">目标：不要把旧的好结果弄坏</text>
      <text x="816" y="270" class="s">用例：golden set / 高风险集 / 烟测</text>
      <text x="816" y="298" class="s">集成：CI 门禁 / 灰度 / 版本对比</text>
    </g>
  </g>
</svg>
