<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check Point Remote Access VPN 自动加载代理脚本 | 网络安全技术博客</title>
  <meta name="description" content="基于 Check Point Remote Access VPN 的连接前后脚本，实现自动加载代理配置，替代 DHCP Option 252（WPAD）下发。包含配置步骤与脚本示例。" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="fx-bg" aria-hidden="true"></div>
  <header class="site-header">
    <nav class="topnav">
      <a class="brand" href="../">网络安全博客</a>
      <div class="links">
        <a href="../">首页</a>
        <a class="active" href="../blog/">博客</a>
        <a href="../tools/">工具箱</a>
        <a href="../about/">关于</a>
      </div>
    </nav>
    <h1>Check Point Remote Access VPN 自动加载代理脚本</h1>
    <p>VPN · 自动化 · 工程实践</p>
  </header>

  <main class="container">
    <article class="post">
      <div id="post-body">正在加载内容…</div>
    </article>
  </main>

  <footer class="site-footer">
    <span>欢迎交流与反馈。</span>
  </footer>

  <script type="module">
    const url = "./remote-access-vpn-content.html";
    fetch(url).then(r=>r.text()).then(html=>{
      const container = document.querySelector("#post-body");
      const doc = new DOMParser().parseFromString(html, "text/html");
      const root = doc.body || doc;

      Array.from(root.querySelectorAll("p")).forEach(p=>{
        const t = (p.textContent || "").trim();
        if (t.startsWith("文档作者：") || /^时间[:：]/.test(t)) p.remove();
      });
      Array.from(root.querySelectorAll("h1")).forEach(h=>{
        const id = h.getAttribute("id") || "";
        const cls = h.getAttribute("class") || "";
        if (id === "目录" || cls.includes("TOC-Heading")) h.remove();
      });
      Array.from(root.querySelectorAll("p")).forEach(p=>{
        const a = p.querySelector("a");
        if (!a) return;
        if (p.childNodes.length === 1 && a.getAttribute("href")?.startsWith("#")) p.remove();
      });

      Array.from(root.querySelectorAll("img")).forEach(img=>{
        img.removeAttribute("style");
        img.style.maxWidth = "100%";
        img.style.borderRadius = "10px";
      });

      const demote = (tag, next)=>{
        Array.from(root.querySelectorAll(tag)).forEach(h=>{
          const nh = doc.createElement(next);
          Array.from(h.attributes).forEach(a=>nh.setAttribute(a.name,a.value));
          nh.innerHTML = h.innerHTML;
          h.replaceWith(nh);
        });
      };
      demote("h3","h4");
      demote("h2","h3");
      demote("h1","h2");

      container.innerHTML = root.innerHTML || html;
    }).catch(()=>{ document.querySelector("#post-body").textContent = "加载失败"; });
  </script>
</body>
</html>
